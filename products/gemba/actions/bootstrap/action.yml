name: FIT Bootstrap
description: >
  Opinionated FIT environment bootstrap. The action sets up Bun. It restores
  one environment cache (CLI tools in ~/.local + node_modules + generated).
  It installs anything missing. It optionally checks out the GitHub wiki. It
  provisions the packs a root apm.yml declares (pinned by apm.lock.yaml) when
  one is present. It then runs ./scripts/bootstrap.sh. To push the wiki back,
  run forwardimpact/wiki@v1 after the agent step.

inputs:
  token:
    description: >
      GitHub token with read access to the wiki. When you provide it, the
      action checks out the wiki into ./wiki. Leave blank to skip the wiki
      checkout entirely. The caller must push the wiki back. See
      forwardimpact/wiki@v1.
    required: false
    default: ""
  app-slug:
    description: >
      GitHub App slug for git identity (e.g. kata-agent-team). Provide it
      with app-id to set the git identity to the app bot account instead of
      the generic github-actions bot.
    required: false
    default: ""
  app-id:
    description: >
      GitHub App ID for git identity email. Use it together with app-slug.
    required: false
    default: ""
  bun-version:
    description: Bun version to install.
    required: false
    default: "1.3.11"
  clis:
    description: >
      Space-separated fit-*/gemba-* CLIs to install as pinned, pre-compiled
      binaries onto PATH (e.g. "gemba-wiki gemba-harness gemba-trace"). Leave
      it empty to install only the external tool set. The bundled
      fit-install.sh fetches and SHA-verifies the binaries. An unsupported
      platform fails hard.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
        no-cache: false

    - name: Configure git identity
      shell: bash
      env:
        APP_SLUG: ${{ inputs.app-slug }}
        APP_ID: ${{ inputs.app-id }}
      run: |
        if [ -n "$APP_SLUG" ] && [ -n "$APP_ID" ]; then
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
        else
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        fi

    # Rebase onto origin/main BEFORE this action computes the workspace cache
    # key, for two reasons. (1) Currency: the run executes against current
    # main instead of a stale branch point. (2) Cache correctness: the key
    # hashes bun.lock and the proto tree, so it must reflect the post-rebase
    # tree the run actually uses. Otherwise a release commit that added a new
    # @forwardimpact/* package could land a "hit" on node_modules that
    # predates it. That hit skips bun install. Codegen then cannot resolve
    # common.proto. This is the sole place the rebase happens.
    # scripts/bootstrap.sh does not sync.
    - name: Sync workspace to origin/main
      shell: bash
      run: |
        set -euo pipefail
        if [ -f .git/shallow ]; then
          git fetch --unshallow origin
        fi
        git fetch origin main
        current_branch=$(git branch --show-current)
        if [ "$current_branch" = "main" ]; then
          git merge --ff-only origin/main
        else
          git branch -f main origin/main
          if git rebase main 2>/dev/null; then
            echo "Rebased '$current_branch' onto main."
          else
            git rebase --abort
            echo "Branch '$current_branch' has conflicts with main. The cache key reflects the pre-rebase state."
          fi
        fi

    - name: Checkout wiki
      if: inputs.token != ''
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki
        token: ${{ inputs.token }}

    # One environment cache covers both the CLI tools and the workspace
    # (node_modules + generated). This step emits every path as one
    # newline-separated list. The list holds the paths the bundled
    # fit-install.sh declares through --paths (each tool's lib dir + bin
    # symlink, plus any requested fit-*/gemba-* binary), plus the workspace
    # dirs. That keeps unrelated ~/.local tools like uv/Python out of the
    # cache. One restore replaces the two former caches. That drops an
    # actions/cache round-trip from the critical path. Layout is static, so
    # the tool paths are correct even on a cold cache before any install
    # runs. The action bundles the installer ($GITHUB_ACTION_PATH), so this
    # never depends on a consumer-repo script.
    - name: Resolve cache paths
      id: cache-paths
      shell: bash
      env:
        CLIS: ${{ inputs.clis }}
      run: |
        {
          echo "paths<<EOF"
          bash "$GITHUB_ACTION_PATH/fit-install.sh" --paths $CLIS
          printf '%s\n' node_modules generated 'libraries/*/src/generated'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        # Different clis sets cache distinctly. A job's cache must never
        # restore another job's tool set. Sanitize the clis string into the key
        # below.
        echo "clis_key=$(printf '%s' "$CLIS" | tr ' ' '_' | tr -cd 'a-zA-Z0-9_-')" >> "$GITHUB_OUTPUT"
        # Hash the bundled installer into the key. It carries every tool version
        # AND the pinned gear release, so a new gear release (new gear binaries)
        # invalidates the cache automatically. Without this, a stale cache hit
        # serves the previous release's binaries and skips the reinstall.
        echo "installer_hash=$(sha256sum "$GITHUB_ACTION_PATH/fit-install.sh" | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - name: Restore environment cache
      id: env-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.cache-paths.outputs.paths }}
        # The vN prefix is a manual cache-buster. Bump it (v2 → v3 → …) when the
        # cached layout changes in a way hashFiles can't see, e.g. the v3 move
        # to the action-bundled fit-install.sh. v4 adds the clis_key segment so
        # each tool set caches separately. The installer_hash segment now folds
        # in the bundled installer's own contents (tool versions + gear release).
        # So tool/binary version changes invalidate the cache automatically. The
        # vN prefix no longer needs a manual bump for them. hashFiles still
        # invalidates on lockfile / proto / codegen-source edits.
        #
        # runner.arch is load-bearing. runner.os is "Linux" for BOTH ubuntu-latest
        # (X64) and ubuntu-24.04-arm (ARM64), so without it an arm64 runner
        # restores the x64 cache and gets x64 binaries in ~/.local. An x64 `just`
        # then dies with "cannot execute binary file: Exec format error". The two
        # architectures must cache under distinct keys.
        key: env-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-paths.outputs.clis_key }}-${{ steps.cache-paths.outputs.installer_hash }}-${{ hashFiles('bun.lock', '**/*.proto', 'libraries/libcodegen/src/**', 'libraries/libcodegen/templates/**', 'libraries/libcodegen/bin/**') }}

    # Always run on macOS. There the brew-managed tools (formulae + fit-gear
    # cask) live in brew's prefix instead of the cached $HOME/.local, so a cache
    # hit restores only the download tools (apm, claude) and the workspace dirs.
    # The script's `brew list || brew install` and `command -v` guards make the
    # re-run cheap and idempotent. Linux still skips on a cache hit.
    - name: Install CLI dependencies
      if: runner.os == 'macOS' || steps.env-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CLIS: ${{ inputs.clis }}
      run: bash "$GITHUB_ACTION_PATH/fit-install.sh" $CLIS

    - name: Add deps to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # When the consumer repo declares packs in a root apm.yml, provision them
    # before scripts/bootstrap.sh so any later agent step finds its profiles and
    # skills on disk. The file is the gate. A repo that commits its trees (the
    # monorepo) or declares no apm.yml takes the no branch. These three steps
    # never run. So no bare `apm install` auto-creates apm.yml.
    - name: Restore apm download cache
      if: hashFiles('apm.yml') != ''
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/apm
        key: apm-v1-${{ runner.os }}-${{ hashFiles('apm.lock.yaml') }}

    - name: Provision packs
      if: hashFiles('apm.yml') != ''
      shell: bash
      run: apm install

    - name: Verify provisioned packs
      if: hashFiles('apm.yml') != ''
      shell: bash
      run: bun "$GITHUB_ACTION_PATH/apm-verify.mjs"

    - name: Bootstrap
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BOOTSTRAP_WORKSPACE_CACHE_HIT: ${{ steps.env-cache.outputs.cache-hit }}
      run: ./scripts/bootstrap.sh

name: Kata Agent
description: >
  Run a Kata agent workflow. The action generates an installation
  token. On an artifact event it classifies the acting account and stands a
  self-caused run down when the repository is over its dispatch budget. It
  then checks out the repository, bootstraps the environment, runs the agent
  with gemba-harness from text, a file, or a GitHub event, and delivers the
  run's conclusion to a callback URL when the caller names one.

inputs:
  # --- Authentication ---
  app-id:
    description: GitHub App ID for the installation token and the git identity
    required: true
  app-private-key:
    description: GitHub App private key for the installation token
    required: true
  anthropic-api-key:
    description: Anthropic API key for the Claude Agent SDK
    required: true
  # --- Agent configuration ---
  mode:
    description: Execution mode (run, supervise, facilitate, discuss)
    required: false
    default: "run"
  task-text:
    description: Inline task text (mutually exclusive with task-file and task-event)
    required: false
  task-file:
    description: Path to task file (mutually exclusive with task-text and task-event)
    required: false
  task-event:
    description: Path to a native GitHub event payload JSON, typically github.event_path (mutually exclusive with task-text and task-file). The gemba-harness CLI composes the task from the payload.
    required: false
    default: ""
  agent-profile:
    description: Agent profile name (run and supervise modes)
    required: false
  lead-profile:
    description: Profile name for the lead role (supervisor / facilitator / chair). The supervise, facilitate, and discuss modes use it.
    required: false
  agent-profiles:
    description: Comma-separated agent profile names (facilitate and discuss modes)
    required: false
  agent-model:
    description: Claude model for agents (all modes). An empty value uses the gemba-harness CLI default.
    required: false
    default: ""
  lead-model:
    description: Claude model for the lead role (supervise / facilitate / discuss modes). An empty value uses the gemba-harness CLI default.
    required: false
    default: ""
  max-turns:
    description: Maximum turns (0 = unlimited)
    required: false
    default: "200"
  allowed-tools:
    description: Comma-separated list of allowed tools for the agent
    required: false
    default: "Bash,Read,Glob,Grep,Write,Edit,Agent,TodoWrite"
  supervisor-allowed-tools:
    description: Comma-separated list of allowed tools for the supervisor (supervise mode only)
    required: false
  task-amend:
    description: Additional text the action appends to the task prompt to steer the run
    required: false
  # --- Discussion and the bridge contract ---
  # discussion-id, resume-context, and inbox-url serve discuss mode. The
  # callback pair serves every mode, because the callback step gates on
  # callback-url alone.
  discussion-id:
    description: Stable id for the threaded discussion (discuss mode). The traces carry it to link runs. Callers use it to resume a suspended run.
    required: false
  resume-context:
    description: JSON-serialized prior state for a resumed discuss run (discuss mode)
    required: false
  callback-url:
    description: URL that receives the run's terminal conclusion. A non-empty value enables the callback step, which delivers on success and on failure. Keep `trace` enabled, because the verb reads the trace to build the payload.
    required: false
    default: ""
  correlation-id:
    description: Correlation id the callback payload echoes back to the caller
    required: false
    default: ""
  inbox-url:
    description: Long-poll URL that injects messages into a live discuss run
    required: false
    default: ""
  # --- Optional overrides ---
  bun-version:
    description: Bun version the bootstrap installs. Leave it empty to take the bootstrap's pinned default.
    required: false
    default: ""
  cwd:
    description: Agent working directory (run mode)
    required: false
    default: "."
  supervisor-cwd:
    description: Supervisor working directory (supervise mode)
    required: false
    default: "."
  agent-cwd:
    description: Agent working directory (supervise, facilitate, and discuss modes)
    required: false
    default: "."
  timeout-minutes:
    description: Maximum minutes before the action cancels the run
    required: false
    default: "45"
  trace:
    description: Enable trace capture and artifact upload
    required: false
    default: "true"
  case:
    description: Case identifier that appears in the trace artifact filenames (use the matrix dimension for matrix runs)
    required: false
    default: "default"
  wiki:
    description: Enable wiki checkout and sync
    required: false
    default: "true"
  killswitch:
    description: >
      Operator killswitch. When you set it to a truthy value (anything other
      than empty/0/false/no/off) the run fails fast. It stops before it mints
      a token, checks out the repository, or does any agent work. Pass the
      `KATA_KILLSWITCH` repository variable so one variable halts every
      kata-* workflow at once.
    required: false
    default: ""
  # --- Dispatch gate ---
  # The one home of the budget and the window. No workflow, template, or CLI
  # flag carries these values.
  dispatch-budget:
    description: >
      Per-counter budget a self-caused run measures against before checkout. A
      counter at or above it stands the run down.
    required: false
    default: "24"
  dispatch-window-hours:
    description: The window the gate's four counters cover, in hours.
    required: false
    default: "2"

outputs:
  trace-file:
    description: >
      Absolute path of the raw NDJSON trace file from the agent run
      (empty when `trace` is disabled). The file wraps each
      agent/supervisor/facilitator/chair/orchestrator event in
      `{source, seq, event}` envelopes. Read it directly to post-process the
      run. For example, run `gemba-trace cost <file>` to sum spend across every
      participant. The internal `gemba-harness` action passes it through.
    value: ${{ steps.assess.outputs.trace-file }}
  trace-dir:
    description: >
      Absolute path of the temp directory that holds all trace files for this
      run (empty when `trace` is disabled). Use it to read the raw or split
      trace files. You do not need to glob the runner's temp space. The
      internal `gemba-harness` action passes it through.
    value: ${{ steps.assess.outputs.trace-dir }}
  case:
    description: >
      Effective case identifier that appears in the trace filenames. The
      internal `gemba-harness` action passes it through.
    value: ${{ steps.assess.outputs.case }}
  actor-class:
    description:
      "`human`, `self`, or `bot`; empty when the run has no artifact event"
    value: ${{ steps.actor.outputs.actor-class }}
  actor-login:
    description: The acting account's login as the payload spells it
    value: ${{ steps.actor.outputs.actor-login }}
  dispatch-verdict:
    description:
      The measurement's verdict on a self-caused run; empty when none ran
    value: ${{ steps.budget.outputs.verdict }}
  stood-down:
    description: "`true` when a self-caused run stood down at the gate"
    value: ${{ steps.gate.outputs.stood-down }}

runs:
  using: composite
  steps:
    # Run the killswitch first. It fails the run before the action mints a
    # token, checks out the repository, or does any agent work. So one
    # repository variable halts every kata-* workflow at once.
    - name: Kata killswitch
      shell: bash
      env:
        KATA_KILLSWITCH: ${{ inputs.killswitch }}
      run: |
        case "$(printf '%s' "${KATA_KILLSWITCH:-}" | tr '[:upper:]' '[:lower:]')" in
          ""|0|false|no|off) ;;
          *) echo "::error::KATA_KILLSWITCH engaged (value: ${KATA_KILLSWITCH})." >&2; exit 1 ;;
        esac

    - name: Generate installation token
      id: ci-app
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    # --- The dispatch gate ---
    # Three steps before checkout; the README describes them. The measurement
    # step continues on error so a self-caused run whose measurement never ran
    # stands down green, with the summary line, instead of reddening the run.
    - name: Classify the actor
      id: actor
      if: inputs.task-event != ''
      shell: bash
      env:
        TASK_EVENT: ${{ inputs.task-event }}
        APP_SLUG: ${{ steps.ci-app.outputs.app-slug }}
      run: |
        bash "$GITHUB_ACTION_PATH/classify-actor.sh" "$TASK_EVENT" "$APP_SLUG" >> "$GITHUB_OUTPUT"

    # This pin moves by hand. Dependabot does not scan this directory.
    - name: Measure the dispatch budget
      id: budget
      if: steps.actor.outputs.actor-class == 'self'
      continue-on-error: true
      uses: forwardimpact/gemba-watchdog@437b84d56a5036d618ce35bcfbda4d03103d66e2 # v1.0.1
      with:
        mode: assess
        threshold: ${{ inputs.dispatch-budget }}
        window-hours: ${{ inputs.dispatch-window-hours }}
        token: ${{ steps.ci-app.outputs.token }}

    - name: Stand down on a breach
      id: gate
      if: steps.actor.outputs.actor-class == 'self'
      shell: bash
      env:
        VERDICT: ${{ steps.budget.outputs.verdict }}
      run: |
        set -euo pipefail
        if [ "$VERDICT" = "quiet" ]; then
          echo "stood-down=false" >> "$GITHUB_OUTPUT"
        else
          echo "stood down: self-caused run, verdict ${VERDICT:-unmeasured}" >> "$GITHUB_STEP_SUMMARY"
          echo "stood-down=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.gate.outputs.stood-down != 'true'
      with:
        fetch-depth: 0
        token: ${{ steps.ci-app.outputs.token }}

    # gemba-bootstrap handles Bun + cached deps + cached workspace +
    # ./scripts/bootstrap.sh. The `token:` input gates wiki checkout. Leave it
    # empty to skip wiki sync. forwardimpact/gemba-wiki below pushes the wiki back
    # after the agent run.
    - uses: forwardimpact/gemba-bootstrap@da20c935595233035b3bd2db67308bbabf8544c6 # v1.0.22
      if: steps.gate.outputs.stood-down != 'true'
      with:
        token: ${{ inputs.wiki == 'true' && steps.ci-app.outputs.token || '' }}
        app-slug: ${{ steps.ci-app.outputs.app-slug }}
        app-id: ${{ inputs.app-id }}
        # An empty value reaches the bootstrap, which resolves its own pinned
        # default. The version literal keeps one home.
        bun-version: ${{ inputs.bun-version }}
        # Install the pre-compiled CLIs the run uses onto PATH. Install
        # gemba-wiki only when wiki sync is on. The gemba-harness/gemba-wiki
        # steps below resolve these binaries before any npx path.
        clis: ${{ inputs.wiki == 'true' && 'gemba-wiki gemba-harness gemba-trace' || 'gemba-harness gemba-trace' }}

    # Render the storyboard from current issue + CSV state before the agent
    # reads it. The facilitator and participants then see an up-to-date
    # Current Condition and up-to-date Active/Concluded lists. They do not see
    # stale markdown. gemba-wiki mints a fresh token for the `gh issue list`
    # calls refresh makes.
    - name: Refresh wiki (pre-run)
      if: inputs.wiki == 'true' && steps.gate.outputs.stood-down != 'true'
      uses: forwardimpact/gemba-wiki@v1
      with:
        command: refresh
        app-id: ${{ inputs.app-id }}
        app-private-key: ${{ inputs.app-private-key }}

    - name: Assess and Act
      id: assess
      if: steps.gate.outputs.stood-down != 'true'
      uses: forwardimpact/gemba-harness@0c18c5b39df9e5abf608c74191f810c68c066dc6 # v1.0.7
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ steps.ci-app.outputs.token }}
        # The actor class and login the classify step derived. The composer
        # renders them as the task's first line and classifies nothing.
        KATA_ACTOR_CLASS: ${{ steps.actor.outputs.actor-class }}
        KATA_ACTOR_LOGIN: ${{ steps.actor.outputs.actor-login }}
        CALLBACK_URL: ${{ inputs.callback-url }}
        CORRELATION_ID: ${{ inputs.correlation-id }}
        INBOX_URL: ${{ inputs.inbox-url }}
        CLAUDE_CODE_USE_BEDROCK: "0"
        # The agent runs in bypass-permissions mode, which Claude Code refuses
        # under uid 0 unless the process is marked sandboxed. gemba-harness@v1
        # sets this on its own run step. Set it here too so the requirement is
        # explicit at the workflow level. It is harmless on non-root runners.
        IS_SANDBOX: "1"
      with:
        mode: ${{ inputs.mode }}
        task-text: ${{ inputs.task-text }}
        task-file: ${{ inputs.task-file }}
        task-event: ${{ inputs.task-event }}
        agent-profile: ${{ inputs.agent-profile }}
        lead-profile: ${{ inputs.lead-profile }}
        agent-profiles: ${{ inputs.agent-profiles }}
        agent-model: ${{ inputs.agent-model }}
        lead-model: ${{ inputs.lead-model }}
        max-turns: ${{ inputs.max-turns }}
        allowed-tools: ${{ inputs.allowed-tools }}
        supervisor-allowed-tools: ${{ inputs.supervisor-allowed-tools }}
        task-amend: ${{ inputs.task-amend }}
        cwd: ${{ inputs.cwd }}
        supervisor-cwd: ${{ inputs.supervisor-cwd }}
        agent-cwd: ${{ inputs.agent-cwd }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        trace: ${{ inputs.trace }}
        case: ${{ inputs.case }}
        discussion-id: ${{ inputs.discussion-id }}
        resume-context: ${{ inputs.resume-context }}

    # Deliver the run's conclusion to the caller that dispatched it, for
    # example a Microsoft Teams or GitHub Discussions bridge. The step runs on
    # both success and failure of the run step, so a caller always gets a
    # verdict. `gemba-harness callback` builds the payload from the trace, and
    # posts the same shape with `verdict: failed` when the run produced none.
    # So this step needs no file guard and no inline payload.
    - name: Deliver callback
      if: always() && inputs.callback-url != ''
      shell: bash
      env:
        CALLBACK_URL: ${{ inputs.callback-url }}
        CORRELATION_ID: ${{ inputs.correlation-id }}
        DISCUSSION_ID: ${{ inputs.discussion-id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TRACE_FILE: ${{ steps.assess.outputs.trace-file }}
      run: |
        set -euo pipefail
        gemba-harness callback \
          --trace-file="$TRACE_FILE" \
          --callback-url="$CALLBACK_URL" \
          --correlation-id="$CORRELATION_ID" \
          --run-url="$RUN_URL" \
          --discussion-id="$DISCUSSION_ID"

    # Re-render the storyboard from the issue + CSV state the agent just
    # produced. That state covers obstacles and experiments it created or
    # closed during the session, and any metric CSV rows it appended. Use
    # always() so the storyboard reflects the run even if the agent failed or
    # timed out. This matches the push below.
    - name: Refresh wiki (post-run)
      if: always() && inputs.wiki == 'true' && steps.gate.outputs.stood-down != 'true'
      uses: forwardimpact/gemba-wiki@v1
      with:
        command: refresh
        app-id: ${{ inputs.app-id }}
        app-private-key: ${{ inputs.app-private-key }}

    # Push agent memory back. gemba-wiki mints a fresh token. The token minted
    # at job start expires after an hour, so a long agent run would leave a
    # cleanup-time push unauthenticated. This step runs under always() so
    # memory is durable whether the agent step succeeded, failed, or timed out.
    - name: Push wiki changes
      if: always() && inputs.wiki == 'true' && steps.gate.outputs.stood-down != 'true'
      uses: forwardimpact/gemba-wiki@v1
      with:
        command: push
        app-id: ${{ inputs.app-id }}
        app-private-key: ${{ inputs.app-private-key }}

    # Sum spend across every participant. Redirect with `>>` and never pipe:
    # a pipe truncates at 64 KiB and silently drops the tail of a long table.
    # gemba-trace cost tolerates a missing trace, because the run may fail
    # before it produces one. So this step needs no file guard.
    - name: Report run cost
      if: always() && steps.gate.outputs.stood-down != 'true'
      shell: bash
      env:
        TRACE_FILE: ${{ steps.assess.outputs.trace-file }}
      run: gemba-trace cost "$TRACE_FILE" --markdown >> "$GITHUB_STEP_SUMMARY"

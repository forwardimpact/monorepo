name: Kata Interview
description: >
  Run a JTBD switching interview against a product at a public website. This
  action owns the generic interview infrastructure: killswitch, token,
  checkout, bootstrap, synthetic-data build, the supervised interview run,
  cost report, wiki push, and run-log secret scan. The app-specific choices
  (entry point, substrate bring-up, persona selection) are pluggable inputs,
  so any consumer can wrap this action.

inputs:
  # --- Authentication ---
  app-id:
    description: GitHub App ID for the installation token and the git identity
    required: true
  app-private-key:
    description: GitHub App private key for the installation token
    required: true
  anthropic-api-key:
    description: Anthropic API key for the Claude Agent SDK
    required: true
  app-slug:
    description: GitHub App slug for git identity
    required: false
    default: "kata-agent-team"
  # --- Interview target ---
  website-url:
    description: Public entry point for the persona agent in Ask 2
    required: true
  product:
    description: Product to interview about (empty = supervisor chooses)
    required: false
  job:
    description: Specific JTBD goal to test (empty = supervisor chooses)
    required: false
  task-amend:
    description: Additional text the action appends to the task prompt to steer the run
    required: false
  # --- Pluggable domain steps ---
  substrate-setup-command:
    description: >
      Shell command that brings up the substrate and emits
      SUPABASE_URL / SUPABASE_ANON_KEY to $GITHUB_ENV. A non-empty value
      selects the substrate path (bring-up + post-run log scan). An empty
      value runs a file-only interview. The command runs with AGENT_CWD set to
      the staged workspace.
    required: false
    default: ""
  persona-select-command:
    description: >
      Command the supervisor runs to seal a persona into $AGENT_CWD and stash a
      bare JWT for the post-run scan. Empty = the persona comes from the
      synthetic story / anonymous access.
    required: false
    default: ""
  # --- Substrate secrets (forwarded only on the substrate path) ---
  jwt-secret:
    description: Supabase JWT secret that the action forwards to the setup/persona commands
    required: false
    default: ""
  service-role-key:
    description: Supabase service-role key that the action forwards to the setup/persona commands
    required: false
    default: ""
  # --- Shared knobs ---
  max-turns:
    description: Maximum turns per runner invocation (0 = unlimited)
    required: false
    default: "200"
  allowed-tools:
    description: Comma-separated tool allowlist for the agent
    required: false
    default: "Bash,Read,Glob,Grep,Write,Edit,WebFetch,WebSearch"
  supervisor-allowed-tools:
    description: Comma-separated tool allowlist for the supervisor
    required: false
    default: "Bash,Read,Glob,Grep,Write,Edit,Skill,TodoWrite"
  killswitch:
    description: >
      Operator killswitch. When you set it to a truthy value (anything other
      than empty/0/false/no/off) the run fails fast. It stops before it mints
      a token, checks out the repository, or does any agent work.
    required: false
    default: ""

outputs:
  trace-file:
    description: >
      Absolute path of the raw NDJSON trace file from the interview run. The
      internal gemba-harness action passes it through.
    value: ${{ steps.interview.outputs.trace-file }}
  trace-dir:
    description: >
      Absolute path of the temp directory that holds all trace files for this
      run. The internal gemba-harness action passes it through.
    value: ${{ steps.interview.outputs.trace-dir }}

runs:
  using: composite
  steps:
    # Run the killswitch first. It fails the run before the action mints a
    # token, checks out the repository, or does any agent work. So one
    # repository variable halts every kata-* workflow at once.
    - name: Kata killswitch
      shell: bash
      env:
        KATA_KILLSWITCH: ${{ inputs.killswitch }}
      run: |
        case "$(printf '%s' "${KATA_KILLSWITCH:-}" | tr '[:upper:]' '[:lower:]')" in
          ""|0|false|no|off) ;;
          *) echo "::error::KATA_KILLSWITCH engaged (value: ${KATA_KILLSWITCH})." >&2; exit 1 ;;
        esac

    - name: Generate installation token
      id: ci-app
      uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
        token: ${{ steps.ci-app.outputs.token }}

    # gemba-bootstrap installs the pre-compiled CLIs the run uses onto PATH.
    # fit-terrain now also provides the generic substrate bring-up, so this
    # step does NOT install fit-map. A consumer's FI substrate command runs it
    # with bunx as its own documented exception.
    - uses: forwardimpact/gemba-bootstrap@3e7b7c78737414a54143882375bc543e4b4f2c36 # v1.0.19
      with:
        token: ${{ steps.ci-app.outputs.token }}
        app-slug: ${{ inputs.app-slug }}
        app-id: ${{ inputs.app-id }}
        clis: fit-terrain gemba-trace gemba-harness gemba-wiki

    - name: Prepare interview workspace
      id: workspace
      shell: bash
      run: |
        agent_dir=$(mktemp -d)

        # Build synthetic data so the supervisor can stage the right subset into
        # the agent CWD per the chosen product. The skill's staging table
        # decides what the supervisor copies.
        fit-terrain build

        # Install the Supabase CLI globally. supabase's postinstall script
        # blocks npm's global install, so use bun.
        bun install -g supabase

        echo "dir=$agent_dir" >> "$GITHUB_OUTPUT"

    # Substrate bring-up is a consumer-supplied command. A non-empty value
    # gates the step. No hardcoded product name gates it. The command must
    # emit SUPABASE_URL / SUPABASE_ANON_KEY to $GITHUB_ENV for the run below.
    - name: Substrate setup
      id: substrate-setup
      if: inputs.substrate-setup-command != ''
      shell: bash
      env:
        AGENT_CWD: ${{ steps.workspace.outputs.dir }}
        JWT_SECRET: ${{ inputs.jwt-secret }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.service-role-key }}
      run: ${{ inputs.substrate-setup-command }}

    - name: Compose task amendment
      id: amend
      shell: bash
      env:
        PRODUCT: ${{ inputs.product }}
        JOB: ${{ inputs.job }}
        USER_AMEND: ${{ inputs.task-amend }}
      run: |
        {
          echo 'amend<<AMEND_EOF'
          [ -n "$PRODUCT" ] && echo "Product: $PRODUCT"
          [ -n "$JOB" ] && echo "Job: $JOB"
          [ -n "$USER_AMEND" ] && echo "$USER_AMEND"
          echo 'AMEND_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Run interview
      id: interview
      uses: forwardimpact/gemba-harness@8570a09c2eab3a82879535c039bdf89bfab76c9e # v1.0.5
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ steps.ci-app.outputs.token }}
        CLAUDE_CODE_USE_BEDROCK: "0"
        IS_SANDBOX: "1"
        # Entry point the supervisor reads in Ask 2, and the persona-select
        # command it runs when the substrate path is active.
        WEBSITE_URL: ${{ inputs.website-url }}
        AGENT_CWD: ${{ steps.workspace.outputs.dir }}
        PERSONA_SELECT_COMMAND: ${{ inputs.substrate-setup-command != '' && inputs.persona-select-command || '' }}
        # Substrate secrets reach the persona-select command only on the
        # substrate path. They are empty otherwise.
        JWT_SECRET: ${{ inputs.substrate-setup-command != '' && inputs.jwt-secret || '' }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.substrate-setup-command != '' && inputs.service-role-key || '' }}
      with:
        mode: "supervise"
        task-text: |
          Run the `kata-interview` skill.

          If a `Product:` or `Job:` line appears below, honour it. Otherwise
          the skill picks. Any other appended text steers the run. Pass it
          through.
        supervisor-cwd: "."
        agent-cwd: ${{ steps.workspace.outputs.dir }}
        lead-profile: "product-manager"
        max-turns: ${{ inputs.max-turns }}
        allowed-tools: ${{ inputs.allowed-tools }}
        supervisor-allowed-tools: ${{ inputs.supervisor-allowed-tools }}
        task-amend: ${{ steps.amend.outputs.amend }}

    # gemba-trace cost tolerates a missing trace, so this step needs no file
    # guard.
    - name: Report run cost
      if: always()
      shell: bash
      env:
        TRACE_FILE: ${{ steps.interview.outputs.trace-file }}
      run: gemba-trace cost "$TRACE_FILE" --markdown >> "$GITHUB_STEP_SUMMARY"

    - name: Push wiki changes
      if: always()
      uses: forwardimpact/gemba-wiki@v1
      with:
        command: push
        app-id: ${{ inputs.app-id }}
        app-private-key: ${{ inputs.app-private-key }}

    # Scan the run's own logs for secret literals on the substrate path. The
    # persona-select command inside the harness step writes the persona-JWT
    # stash. The missing-file guard covers an unset command. gemba-harness
    # scan-logs owns the archive download and fails closed.
    - name: Scan logs for sensitive values
      if: always() && inputs.substrate-setup-command != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.ci-app.outputs.token }}
        JWT_SECRET: ${{ inputs.jwt-secret }}
        SERVICE_ROLE_KEY: ${{ inputs.service-role-key }}
      run: |
        stash="$RUNNER_TEMP/.persona-jwt"
        secrets=()
        if [ -f "$stash" ]; then
          persona_jwt=$(cat "$stash")
          echo "::add-mask::$persona_jwt"
          secrets+=(--secret "persona-jwt=$persona_jwt")
        else
          echo "No persona-JWT stash at $stash. The persona-select command did not run."
        fi
        [ -n "$JWT_SECRET" ] && secrets+=(--secret "jwt-secret=$JWT_SECRET")
        [ -n "$SERVICE_ROLE_KEY" ] && secrets+=(--secret "service-role-key=$SERVICE_ROLE_KEY")

        gemba-harness scan-logs \
          --run-id "${{ github.run_id }}" \
          --repo "${{ github.repository }}" \
          "${secrets[@]}"

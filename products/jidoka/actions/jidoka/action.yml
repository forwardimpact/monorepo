name: Jidoka
description: |
  Run the jidoka checks against the repository. The checks build in quality
  for the layered instruction architecture that JIDOKA.md defines. They stop
  the line at the first drifted layer, stale jobs block, or broken invariant.

  When you omit `command`, every check runs (instructions and jtbd). When you
  set `command` to "instructions", "jtbd", or "invariants", only that
  subcommand runs.

  This action assumes forwardimpact/gemba-bootstrap already bootstrapped the
  workspace. That action installs `jidoka` as a pinned gear binary on PATH
  (it is one of the default tools). The binary is required. There is no
  bunx/npx fallback.

inputs:
  command:
    description: 'Subcommand to run: "instructions", "jtbd", or "invariants". Leave empty to run every check.'
    required: false
    default: ""
  fix:
    description: 'For "jtbd": regenerate stale catalog and jobs blocks in place. Only valid when command=jtbd.'
    required: false
    default: "false"
  working-directory:
    description: Directory in which to run the command. Defaults to the repository root.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Run jidoka
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        FIX: ${{ inputs.fix }}
      run: |
        # jidoka is a pinned gear binary on PATH (a default bootstrap tool).
        # Assume it is present. It validates its own command/flag set.
        args=()
        [ -n "$COMMAND" ] && args+=("$COMMAND")
        [ "$FIX" = "true" ] && args+=("--fix")
        jidoka "${args[@]}"

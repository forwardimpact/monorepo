name: Release Tagger
description: >
  Create append-only release tags on a target repo. For action releases
  (`v<major>.<minor>.<patch>`), also move the `v<major>` alias forward. The
  monorepo's v1-move policy governs that move. The action is deterministic and
  idempotent. It never moves an existing release tag. The major alias only ever
  moves forward to a commit that carries the release tag and that the default
  branch can reach.

inputs:
  owner:
    description: Repository owner (org).
    required: true
  repo:
    description: Target repository name (no owner prefix).
    required: true
  tags:
    description: Whitespace/comma-separated release tags to create.
    required: true
  sha:
    description: Commit to tag. It defaults to the target repo's default-branch tip.
    required: false
    default: ""
  token:
    description: >
      Token with `contents: write` on the target repo (an App installation
      token scoped to that repo). The caller mints it, because composite
      actions cannot read secrets.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        TAGS: ${{ inputs.tags }}
        SHA_INPUT: ${{ inputs.sha }}
        TAG_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # Work in a throwaway clone of the TARGET repo. Then this action can
        # tag any org repo. It is not limited to the repo it runs in.
        # blob:none keeps the full commit graph + tags (needed for ancestry
        # and alias checks) and does not fetch file contents.
        work="$(mktemp -d)"
        git clone --quiet --filter=blob:none \
          "https://x-access-token:${TAG_TOKEN}@github.com/${OWNER}/${REPO}.git" "$work"
        cd "$work"
        git config user.name "kata-agent-team[bot]"
        git config user.email "kata-agent-team[bot]@users.noreply.github.com"

        default_ref="$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null || echo origin/main)"

        # Resolve and validate the target commit. It must be a full SHA that
        # the default branch can reach (a reviewed commit). It must never be
        # an arbitrary ref.
        target="${SHA_INPUT:-$(git rev-parse "$default_ref")}"
        if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "::error::sha must be a full 40-char commit (got '$target')"; exit 1
        fi
        if ! git merge-base --is-ancestor "$target" "$default_ref"; then
          echo "::error::${default_ref#origin/} cannot reach target $target"; exit 1
        fi

        # Normalize the separators. Then validate every tag's shape up front,
        # so a bad entry fails before the action pushes anything.
        tags="$(printf '%s' "$TAGS" | tr ',\n\r\t' '    ')"
        n=0
        for t in $tags; do
          case "$t" in
            *@v[0-9]*) ;;                       # package release: <name>@v<version>
            v[0-9]*.[0-9]*.[0-9]*) ;;           # action release: v<major>.<minor>.<patch>
            *) echo "::error::tag '$t' is not release-shaped"; exit 1 ;;
          esac
          n=$((n + 1))
        done
        [ "$n" -gt 0 ] || { echo "::error::no tags supplied"; exit 1; }

        for t in $tags; do
          # Append-only. Create the release tag if it is absent. Never move it.
          if git rev-parse -q --verify "refs/tags/$t^{commit}" >/dev/null 2>&1; then
            echo "$t already exists. This run leaves it in place"
          else
            git tag "$t" "$target"
            git push --quiet origin "refs/tags/$t"
            echo "created $t -> $target"
          fi
          tag_commit="$(git rev-parse "refs/tags/$t^{commit}")"

          # v1-move applies only to exact v<major>.<minor>.<patch> action
          # releases. The major alias always tracks the latest release commit.
          # It is NOT forward-only. Subtree-split projections are re-seeded
          # periodically (an upstream history rewrite orphans older projected
          # commits), so a new release legitimately lands off the previous
          # alias lineage. An ancestor check would wedge the alias permanently.
          # The lighter guard below gives the safety. The target carries this
          # release tag and sits on the default branch (never an arbitrary or
          # off-branch SHA).
          printf '%s' "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || continue
          major="${t%%.*}"
          if ! git merge-base --is-ancestor "$tag_commit" "$default_ref"; then
            echo "::error::$t ($tag_commit) is not on ${default_ref#origin/}. This run refuses to move $major"; exit 1
          fi
          if [ "$(git rev-parse -q --verify "refs/tags/$major^{commit}" 2>/dev/null || true)" = "$tag_commit" ]; then
            echo "$major already at $tag_commit"
          else
            git tag -f "$major" "$tag_commit"
            git push --force --quiet origin "refs/tags/$major"
            echo "set $major -> $tag_commit"
          fi
        done

name: "Publish: Actions"

# Outbound mirror for every co-located composite action: the agent-run actions
# under products/gemba/actions/, the gemba-watchdog guardrail action beside
# them (it runs no agent), the Kata actions under products/kata/actions/, and
# the Jidoka product's check action under products/jidoka/actions/. The counted
# set lives in the enum fences in .github/CLAUDE.md and KATA.md. Each leg splits its monorepo prefix with the pinned
# splitsh-lite. It then non-force-pushes the projection to its sibling repo's
# main (see ./.github/actions/split-and-push). Edit one matrix entry to add or
# retire an action.
#
# This workflow fires on every push to main that touches an action source
# (paths-filtered), plus manual dispatch. Each lineage is seeded once. A prefix
# rename re-seeds it once more. Those are the only sanctioned force pushes.
# Every run here is a non-force fast-forward. A non-fast-forward means a
# sibling main diverged from the projection. The workflow rejects it and the
# run fails.
on:
  push:
    branches: [main]
    paths:
      - "products/gemba/actions/gemba-harness/**"
      - "products/gemba/actions/gemba-benchmark/**"
      - "products/gemba/actions/gemba-wiki/**"
      - "products/gemba/actions/gemba-bootstrap/**"
      - "products/gemba/actions/gemba-watchdog/**"
      - "products/kata/actions/kata-agent/**"
      - "products/kata/actions/kata-interview/**"
      - "products/jidoka/actions/jidoka/**"
      - ".github/actions/split-and-push/**"
      - ".github/workflows/publish-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.action.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - prefix: products/gemba/actions/gemba-harness
            repo: gemba-harness
          - prefix: products/gemba/actions/gemba-benchmark
            repo: gemba-benchmark
          - prefix: products/gemba/actions/gemba-wiki
            repo: gemba-wiki
          - prefix: products/kata/actions/kata-agent
            repo: kata-agent
          - prefix: products/kata/actions/kata-interview
            repo: kata-interview
          - prefix: products/gemba/actions/gemba-bootstrap
            repo: gemba-bootstrap
          - prefix: products/gemba/actions/gemba-watchdog
            repo: gemba-watchdog
          - prefix: products/jidoka/actions/jidoka
            repo: jidoka
    steps:
      - name: Generate installation token
        id: ci-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.KATA_APP_ID }}
          private-key: ${{ secrets.KATA_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.action.repo }}

      # Check out the monorepo with full history, which the split needs. The
      # split and the local-action references below resolve against this
      # checkout, never a sibling.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do not leave the default-token http.extraheader in git config. It
          # would override the App token in the cross-repo push URL. GitHub
          # would then deny the push as github-actions[bot].
          persist-credentials: false

      - uses: ./.github/actions/audit
        with:
          vulnerability-scanning: "false"
          secret-scanning: "true"

      - name: Split and push
        uses: ./.github/actions/split-and-push
        with:
          prefix: ${{ matrix.action.prefix }}
          sibling-repo: ${{ matrix.action.repo }}
          token: ${{ steps.ci-app.outputs.token }}

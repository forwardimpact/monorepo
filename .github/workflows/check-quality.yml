name: "Check: Quality"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@60fc7428dd4755d6f49f9d4b4ad0b64ddb5a4b56 # v1.0.21
      - run: bun run format:js

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@60fc7428dd4755d6f49f9d4b4ad0b64ddb5a4b56 # v1.0.21
      - run: bun run lint:js

  format-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@60fc7428dd4755d6f49f9d4b4ad0b64ddb5a4b56 # v1.0.21
      - run: bun run format:md

  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@60fc7428dd4755d6f49f9d4b4ad0b64ddb5a4b56 # v1.0.21
      - run: bun run lint:md

  jsdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@60fc7428dd4755d6f49f9d4b4ad0b64ddb5a4b56 # v1.0.21
      - run: bun run jsdoc

name: "Check: Context"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@3e7b7c78737414a54143882375bc543e4b4f2c36 # v1.0.19
      - uses: ./products/jidoka/actions/jidoka
        with:
          command: instructions

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@3e7b7c78737414a54143882375bc543e4b4f2c36 # v1.0.19
      - run: bun run context:check-metadata

  jtbd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@3e7b7c78737414a54143882375bc543e4b4f2c36 # v1.0.19
      - uses: ./products/jidoka/actions/jidoka
        with:
          command: jtbd

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@3e7b7c78737414a54143882375bc543e4b4f2c36 # v1.0.19
      - uses: ./products/jidoka/actions/jidoka
        with:
          command: invariants

  # The wiki gate.
  #
  # A RED `wiki` check, on a PR or on the push-to-`main` run, means THIS
  # commit's diff broke a wiki audit RULE or its tooling. It does NOT mean the
  # shared wiki is currently dirty. The job runs `bun run wiki:rules` against
  # committed libwiki fixtures and never reads the live wiki. So the verdict is
  # a function of the PR head alone. It is deterministic across re-runs and
  # immune to concurrent wiki writes. The daily curation run (curate-wiki.yml)
  # owns the shared-wiki audit findings. They route to one `wiki-curation`
  # issue addressed to the technical-writer. They never redden a commit-status
  # gate.
  #
  # These surfaces couple to the wiki. A change here can alter what the audit
  # verifies or how it verifies, so this gate's `wiki:rules` run exercises them:
  #   - libraries/libwiki/**            (audit rules, engine, CLI, their tests)
  #   - package.json `wiki`/`wiki:rules` scripts
  #   - .github/workflows/check-context.yml (this check's own definition)
  # This list is documentation. It is not a runtime path filter. `wiki:rules`
  # runs these surfaces' tests, so the verdict is already scoped to them.
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@3e7b7c78737414a54143882375bc543e4b4f2c36 # v1.0.19
      - run: bun run wiki:rules

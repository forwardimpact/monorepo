name: "Eval: Jidoka"

on:
  workflow_dispatch:

concurrency:
  group: eval-jidoka-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fan the jidoka-skills family (2 tasks × runs:5 = 10 cells) across
  # machines through the benchmark reusable workflow. Then merge the shard
  # ledgers into one pass@k. One shard per task keeps each machine's run small.
  # This caller only picks the family and shard count. The filesystem
  # work-tracker is the reusable workflow's env contract.
  benchmark:
    uses: forwardimpact/gemba-benchmark/.github/workflows/benchmark.yml@e006c7c68cf59ba6a13921c293366407fa25475a # v1.0.13
    with:
      family: ./benchmarks/jidoka-skills
      runs: "5"
      max-turns: "30"
      judge-profile: judge
      shard-total: "2"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

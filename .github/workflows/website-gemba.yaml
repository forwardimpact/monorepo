name: "Website: Gemba"

on:
  push:
    branches: [main]
    paths:
      - "websites/gemba/**"
      - "design/gemba/**"
      - "design/assets/**"
      - "libraries/libdoc/**"
      - ".github/workflows/website-gemba.yaml"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/website.yml
    with:
      site: gemba
    secrets: inherit

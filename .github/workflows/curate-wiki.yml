name: Curate wiki

# The shared-state wiki audit runs on a defined cadence. This is the SOLE home
# of the shared-wiki audit verdict. The per-PR `wiki` check
# (check-context.yml) no longer reads live wiki state. See the gate doc beside
# the `wiki` job in check-context.yml.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize runs that overlap (a manual dispatch during the daily tick) so the
# search-then-create issue logic below cannot open a second issue.
concurrency:
  group: curate-wiki
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: forwardimpact/bootstrap@a5d9098c2a1e68277f02fad39583a34ee003d9c9 # v1.0.18
        with:
          clis: gemba-wiki
      - name: Checkout wiki (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      # Audit the shared wiki. When it is dirty, route the findings to the
      # single wiki-curation issue (create or comment). `gemba-wiki curate`
      # holds the label, search, and create-or-comment logic. This workflow
      # does not.
      - name: Audit and route findings
        env:
          GH_TOKEN: ${{ github.token }}
          FIT_GH_REPO: ${{ github.repository }}
        run: gemba-wiki curate

name: "Kata: Interview"

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Product to interview about (leave empty for supervisor to choose)"
        required: false
        type: string
      job:
        description: "Specific JTBD job goal to test (leave empty for supervisor to choose)"
        required: false
        type: string
      task-amend:
        description: "Extra text appended to the task prompt to steer the run"
        required: false
        type: string
      website-url:
        description: "Public entry point handed to the persona agent (leave empty to derive it from the product)"
        required: false
        type: string
      empty-corpus-test:
        description: "Force substrate-stage to see an empty corpus (CI assertion)"
        required: false
        type: boolean
        default: false

concurrency:
  group: kata-interview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interview:
    runs-on: ubuntu-latest
    # A composite action cannot declare concurrency or a job timeout. Both
    # stay here. Keep timeout-minutes strictly under 60 so a stalled run
    # cannot outlive its 1-hour App token.
    timeout-minutes: 50
    steps:
      # Each product publishes on the site that documents it. Gemba, Kata, and
      # Jidoka have their own sites. Every other product stays on Forward
      # Impact. An explicit website-url input wins. An empty product means the
      # supervisor picks the product, so the persona starts on Forward Impact.
      - name: Resolve the public entry point
        id: entry
        env:
          OVERRIDE: ${{ inputs.website-url }}
          PRODUCT: ${{ inputs.product }}
        run: |
          url="$OVERRIDE"
          if [ -z "$url" ]; then
            case "$PRODUCT" in
              gemba) url="https://www.gemba.team" ;;
              kata) url="https://www.kata.team" ;;
              jidoka) url="https://www.jidoka.team" ;;
              *) url="https://www.forwardimpact.team" ;;
            esac
          fi
          echo "url=$url" >>"$GITHUB_OUTPUT"

      # Thin wrapper over the reusable action. The only monorepo-specific
      # knowledge lives here: which products are substrate-backed, and the FI
      # substrate + persona commands. The action gates all substrate steps on
      # `substrate-setup-command != ''`. So a file-only product passes an
      # empty command and skips bring-up, persona selection, and the log scan.
      # Persona pick/issue run `fit-terrain` (on PATH through the gear bundle).
      # They carry the FI-specific values as explicit options: the pick memory
      # and the issued token name. `bunx fit-map substrate stage` is the sole
      # remaining `fit-map` exception. fit-map ships in the map release. It is
      # absent from the gear bundle on PATH.
      - uses: forwardimpact/kata-interview@03b304ae3b7dbecee0c8dd6a12aa260936fd758c # v1.0.2
        with:
          app-id: ${{ secrets.KATA_APP_ID }}
          app-private-key: ${{ secrets.KATA_APP_PRIVATE_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          website-url: ${{ steps.entry.outputs.url }}
          product: ${{ inputs.product }}
          job: ${{ inputs.job }}
          task-amend: ${{ inputs.task-amend }}
          substrate-setup-command: ${{ contains(fromJSON('["landmark"]'), inputs.product) && format('SUBSTRATE_FORCE_EMPTY_CORPUS={0} bunx fit-map substrate stage --cwd "$AGENT_CWD" --emit-env "$GITHUB_ENV"', inputs.empty-corpus-test) || '' }}
          persona-select-command: ${{ contains(fromJSON('["landmark"]'), inputs.product) && 'persona=$(fit-terrain substrate pick --format json --memory "wiki/kata-interview/picks.csv") && printf ''%s\n'' "$persona" && email=$(printf ''%s'' "$persona" | jq -r ''.personas[0].email'') && fit-terrain substrate issue --email "$email" --cwd "$AGENT_CWD" --token-env PRODUCT_LANDMARK_TOKEN --stash "$RUNNER_TEMP/.persona-jwt"' || '' }}
          jwt-secret: ${{ secrets.SUPABASE_JWT_SECRET }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          killswitch: ${{ vars.KATA_KILLSWITCH }}

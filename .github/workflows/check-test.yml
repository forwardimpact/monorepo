name: "Check: Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # This is the blocking gate. node --test is the reference-correct runner on
  # the critical path. This is the single required PR + main test check (mark
  # it required in branch protection). The bun `test` job below stays
  # informational.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@8ab3c3244f3d0b9fc220e664f094836b26f860a8 # v1.0.20
        with:
          clis: fit-terrain
      # libwiki's push path secret-scans with gitleaks (fail-closed). The
      # wiki-sync integration tests in the gate set need the binary on PATH,
      # exactly as the informational bun `test` job below does.
      - uses: ./.github/actions/install-gitleaks
      - run: fit-terrain build
      - name: Guard against bun:test re-divergence
        run: bun scripts/check-bun-test-imports.mjs
      - name: Run gate (node --test)
        run: bun run test:gate

  # This job is informational only. It keeps the fast bun inner-loop visible.
  # It surfaces the bun#5090 describe-in-test cascade, so it must NOT be a
  # required check. A blocking version would move the flaky blocker from the
  # release tag to the PR queue.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@8ab3c3244f3d0b9fc220e664f094836b26f860a8 # v1.0.20
        with:
          clis: fit-terrain
      # libwiki's push path secret-scans with gitleaks (fail-closed). The
      # wiki-sync push tests need the binary present on PATH.
      - uses: ./.github/actions/install-gitleaks
      - run: fit-terrain build
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forwardimpact/gemba-bootstrap@8ab3c3244f3d0b9fc220e664f094836b26f860a8 # v1.0.20
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chrome
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chrome
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: synthetic-cache
        with:
          path: |
            data/pathway
            data/knowledge
            data/activity
            data/personal
          key: synthetic-${{ hashFiles('data/synthetic/**', 'libraries/libskill/schema/json/**', 'bun.lock') }}
      - if: steps.synthetic-cache.outputs.cache-hit != 'true'
        run: just synthetic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public
          key: pathway-build-${{ hashFiles('data/synthetic/**', 'libraries/libskill/schema/json/**', 'products/pathway/src/**', 'products/map/starter/**', 'libraries/**/src/**', 'libraries/**/package.json', 'bun.lock') }}
      - run: bun run test:e2e
